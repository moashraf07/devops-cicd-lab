name: CI

on:
  push:
    branches:
      - main
  pull_request:    

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NOD_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Node Env
        run: echo "Env is $NOD_ENV"

      - name: Test Secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: echo "Secret is configured"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

  docker-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t devops-cicd-lab:v2 .
      - name: Tag Docker image
        run: docker tag devops-cicd-lab:v2 moashraf07/devops-cicd-lab:v2
      - name: Push Docker image
        run: docker push moashraf07/devops-cicd-lab:v2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            docker pull moashraf07/devops-cicd-lab:v2
            docker stop devops-app || true
            docker rm devops-app || true
            docker ps -q --filter publish=3000 | xargs -r docker rm -f
            docker run -d --name devops-app -p 3000:3000 moashraf07/devops-cicd-lab:v2
            sleep 5
            curl -f http://localhost:3000/api/status
    

         
